<!doctype html><html><head><meta charset="utf-8"><title>Build sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#cfe3f2 linear-gradient(#0001 1px,transparent 1px) 0 0/24px 24px;font-family:Rubik,sans-serif;color:#111}
body{background-image:linear-gradient(#0000000d 1px,transparent 1px),linear-gradient(90deg,#0000000d 1px,transparent 1px);background-size:24px 24px}
.n{position:absolute;font-weight:800;line-height:.8}
.big{left:48px;top:48px;font-size:260px}
.car{position:absolute;left:380px;top:120px;width:720px;height:440px;background:url(truck.webp) center/cover;border:4px solid #111;filter:grayscale(.85) contrast(.9);opacity:.55}
.new{position:absolute;left:640px;top:170px;width:300px;height:110px;border:5px solid #e3172b;background:#e3172b33}
.arrow{position:absolute;left:940px;top:140px;width:200px;height:4px;background:#111;transform:rotate(-14deg)}
.call{position:absolute;right:48px;top:48px;width:260px;height:220px;border:4px solid #111;background:#fff;padding:18px}
.call h3{font-size:30px;font-weight:800}.call p{font-size:22px;margin-top:8px}
.steps{position:absolute;left:48px;right:48px;bottom:48px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.steps div{background:#fff;border:3px solid #111;padding:14px;height:150px}
.steps b{font-size:54px;font-weight:800}.steps span{display:block;font-size:22px}
.steps .on{background:#e3172b;color:#fff;border-color:#e3172b}
h1{position:absolute;left:48px;top:330px;font-size:64px;font-weight:800;line-height:.95;width:320px}
.cta{position:absolute;left:48px;top:500px;background:#111;color:#fff;font-size:24px;font-weight:800;padding:18px 26px;text-decoration:none}
</style></head><body>
<div class="n big">3</div><h1>Coat it, panel by panel.</h1><a class="cta" href="#">Book a bay</a>
<div class="car"></div><div class="new"></div><div class="arrow"></div>
<div class="call"><h2 style="font-size:30px">1:1 · Ceramic</h2><p>One section at a time, levelled to gloss.</p></div>
<div class="steps"><div><b>1</b><span>Check-in</span></div><div><b>2</b><span>Foam + rinse</span></div><div class="on"><b>3</b><span>Ceramic</span></div><div><b>4</b><span>Tint</span></div><div><b>5</b><span>Film</span></div><div><b>6</b><span>Ready</span></div></div>
</body></html>
