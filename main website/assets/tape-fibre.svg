<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <!-- Crepe-paper fibre for the masking-tape strips on the Dapper site. Authored procedural texture, multiplied over the tape colour. -->
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9 .045" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .48  0 0 0 0 .36  0 0 0 .55 0"/>
  </filter>
  <rect width="240" height="120" fill="#fff"/>
  <rect width="240" height="120" filter="url(#f)"/>
</svg>
