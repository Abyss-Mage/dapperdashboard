# Dapper on the server's IP address, before DNS is linked (owner 2026-11-13). Let's Encrypt does not issue for a bare IP, so HTTPS uses
# a self-signed certificate made for this IP (browsers warn until the domain is linked; see the setup guide, step 8).
# Copy to /etc/apache2/sites-available/dapper-ip.conf, replace 201.18.205.129 if the server has another address, then:
#   a2enmod proxy proxy_http headers ssl rewrite && a2ensite dapper-ip && a2dissite 000-default && apachectl configtest && systemctl reload apache2
# When DNS is linked, switch to apache-dapper.conf (domain sites + certbot) and a2dissite dapper-ip.

<VirtualHost *:80>
	ServerName 201.18.205.129
	RewriteEngine On
	RewriteRule ^ https://201.18.205.129%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
	ServerName 201.18.205.129
	SSLEngine on
	SSLCertificateFile    /etc/dapper/tls/ip.crt
	SSLCertificateKeyFile /etc/dapper/tls/ip.key

	# The gateway only answers for the addresses it knows (here the site address https://201.18.205.129).
	ProxyPreserveHost On
	# Photo uploads take minutes and owner backups up to 2 hours.
	ProxyTimeout 7200
	RequestHeader set X-Forwarded-Proto "https"

	# The legacy import MCP server (token required). It streams its answers, so nothing is buffered or compressed on this path.
	SetEnvIf Request_URI "^/legacy-import/" no-gzip=1
	ProxyPass        /legacy-import/ http://127.0.0.1:8765/legacy-import/ flushpackets=on
	ProxyPassReverse /legacy-import/ http://127.0.0.1:8765/legacy-import/

	ProxyPass        / http://127.0.0.1:8443/
	ProxyPassReverse / http://127.0.0.1:8443/

	ErrorLog ${APACHE_LOG_DIR}/dapper-error.log
	CustomLog ${APACHE_LOG_DIR}/dapper-access.log combined
</VirtualHost>
