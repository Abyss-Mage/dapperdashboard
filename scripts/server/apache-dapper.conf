# Dapper production front door for Apache 2.4 (Ubuntu 26.04). Copy to /etc/apache2/sites-available/dapper.conf, then:
#   a2enmod proxy proxy_http headers ssl rewrite && a2ensite dapper && a2dissite 000-default && apachectl configtest && systemctl reload apache2
#   certbot --apache -d dashboard.dapperdetailing.ca -d workspace.dapperdetailing.ca
# certbot copies each site below into an HTTPS (:443) site with a Let's Encrypt certificate and makes plain HTTP redirect to it.
#
# What the app needs from the proxy:
#   ProxyPreserveHost On   the gateway only answers for the addresses it knows (DAPPER_SITE_URL and DAPPER_EXTRA_ORIGINS)
#   long ProxyTimeout      photo uploads take minutes and owner backups up to 2 hours (the app keeps its own shorter limits elsewhere)
#   X-Forwarded-For        added by Apache itself; the app records the visitor's address from it

<VirtualHost *:80>
	ServerName dashboard.dapperdetailing.ca
	ProxyPreserveHost On
	ProxyTimeout 7200
	RequestHeader set X-Forwarded-Proto "https"

	# The legacy import MCP server (token required; see dapper-import-mcp.service). It streams its answers, so nothing is buffered or
	# compressed on this path.
	SetEnvIf Request_URI "^/legacy-import/" no-gzip=1
	ProxyPass        /legacy-import/ http://127.0.0.1:8765/legacy-import/ flushpackets=on
	ProxyPassReverse /legacy-import/ http://127.0.0.1:8765/legacy-import/

	ProxyPass        / http://127.0.0.1:8443/
	ProxyPassReverse / http://127.0.0.1:8443/

	ErrorLog ${APACHE_LOG_DIR}/dapper-error.log
	CustomLog ${APACHE_LOG_DIR}/dapper-access.log combined
</VirtualHost>

<VirtualHost *:80>
	ServerName workspace.dapperdetailing.ca
	ProxyPreserveHost On
	ProxyTimeout 7200
	RequestHeader set X-Forwarded-Proto "https"
	ProxyPass        / http://127.0.0.1:8443/
	ProxyPassReverse / http://127.0.0.1:8443/
	ErrorLog ${APACHE_LOG_DIR}/dapper-error.log
	CustomLog ${APACHE_LOG_DIR}/dapper-access.log combined
</VirtualHost>

